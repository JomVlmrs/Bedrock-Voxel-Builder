name: Deploy Bedrock Voxel Builder from public

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify public site files
        shell: bash
        run: |
          test -s ./public/index.html
          test -s ./public/builder.js
          test -s ./public/data/vanilla-blocks.json
          test -s ./public/data/block-states.json
          test -s ./public/data/terrain_texture.json
          test -s ./public/data/sample-version.json

      - name: Build static site from ./public
        shell: bash
        run: |
          mkdir -p ./_site
          cp -a ./public/. ./_site/
          touch ./_site/.nojekyll
          test -s ./_site/index.html
          test -s ./_site/data/vanilla-blocks.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
