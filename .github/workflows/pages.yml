name: Deploy Bedrock Voxel Builder to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site from public/
        shell: bash
        run: |
          mkdir -p _site
          cp -R public/. _site/

          # This is a project site (/<repository-name>/), not a domain-root site.
          # Rewrite local root-relative asset/data paths so they work under that prefix.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("_site")
          html = root / "index.html"
          text = html.read_text(encoding="utf-8")
          text = text.replace('href="/', 'href="./').replace('src="/', 'src="./')
          html.write_text(text, encoding="utf-8")

          for name in ("builder.js", "catalog-fallback.js"):
              path = root / name
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace('fetch("/data/', 'fetch("./data/')
              text = text.replace("fetch('/data/", "fetch('./data/")
              text = text.replace('"/data/models/', '"./data/models/')
              text = text.replace("'/data/models/", "'./data/models/")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
